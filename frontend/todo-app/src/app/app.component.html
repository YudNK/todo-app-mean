<div class="title">
  <h1>ToDo</h1>
</div>
<div class="items">
  <div class="col1"></div>
  <div class="col2">
    <input type="text" [formControl]="taskForm" required />
  </div>
  <div class="col3">
    <button (click)="addItem()">
      <span class="material-symbols-outlined">add</span>
    </button>
  </div>
</div>
@for(item of items(); track item.id) {
<app-item [item]=item (itemDeleted)="removeItem($event)"></app-item>
}
@if (alertFlg()) {
<div class="alert">input required!</div>
}
